<!DOCTYPE html>
<html>
<head>
    <title>Percabangan</title>
</head>
<body>
    <h2>Percabangan If Else</h2>

    <script>
        let nilai = 90;

        document.write("Nilai: " + nilai + "<br>");

        if (nilai >= 75) {
            document.write("Keterangan: Lulus");
        } else {
            document.write("Keterangan: Tidak Lulus");
        }
    </script>
</body>
</html>
